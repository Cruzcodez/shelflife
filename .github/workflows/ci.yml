name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. The default token can write to the repo; this one can't.
permissions:
  contents: read

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can see what's actually tracked.
          fetch-depth: 0

      - name: Run checks
        run: ./scripts/check.sh
